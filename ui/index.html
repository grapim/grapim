<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Grapim</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20'%3E%3Cpath d='M10 1.5 18.5 10 10 18.5 1.5 10Z' fill='none' stroke='%231a1a17' stroke-width='1.8'/%3E%3Cpath d='M10 6 14 10 10 14 6 10Z' fill='%231a1a17'/%3E%3C/svg%3E">
  <script>
    // Apply the theme before first paint, so there is no flash. Embedded
    // (?embed=1), the host picks it with ?theme= and nothing is saved.
    try {
      const q = new URLSearchParams(location.search), h = document.documentElement;
      const t = q.get('embed') === '1' ? q.get('theme') : localStorage.getItem('grapim.theme');
      if (q.get('embed') === '1') h.classList.add('embed');
      if (t === 'light' || t === 'dark') h.dataset.theme = t;
    } catch {}
  </script>
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <a class="skip-link" href="#view">Skip to content</a>
  <div class="app">
    <aside class="sidebar" aria-label="Primary">
      <div class="brand"><svg class="brand-mark" viewBox="0 0 20 20" aria-hidden="true" focusable="false"><path d="M10 1.5 18.5 10 10 18.5 1.5 10Z" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M10 6 14 10 10 14 6 10Z" fill="currentColor"/></svg><span class="brand-name">Grapim</span></div>
      <div class="repo" id="repo"><div class="repo-name"><span class="sk" style="width:96px"></span></div><div class="repo-meta"><span class="sk" style="width:140px;margin-top:6px"></span></div></div>
      <button class="search-btn" type="button" data-action="palette">
        <svg class="icon sm" viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="m10.5 10.5 3 3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        <span>Jump to…</span><kbd data-mod>Ctrl</kbd><kbd>K</kbd>
      </button>
      <nav class="nav" id="nav-side" aria-label="Views"></nav>
      <div class="sidebar-foot">
        <div class="conn" id="conn" data-state="connecting" role="status"><span class="pip"></span><span class="txt">Connecting…</span></div>
        <div class="foot-row">
          <div class="seg icons" id="theme-side" role="group" aria-label="Theme"></div>
        </div>
      </div>
    </aside>
    <div class="main">
      <header class="topbar">
        <div class="topbar-row">
          <svg class="brand-mark" viewBox="0 0 20 20" aria-hidden="true" focusable="false"><path d="M10 1.5 18.5 10 10 18.5 1.5 10Z" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M10 6 14 10 10 14 6 10Z" fill="currentColor"/></svg>
          <span class="repo-inline" id="repo-inline">Grapim</span>
          <button class="icon-btn" type="button" data-action="palette" aria-label="Search or jump to">
            <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="m10.5 10.5 3 3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          </button>
          <button class="icon-btn" type="button" data-action="theme-cycle" id="theme-top" aria-label="Theme"></button>
        </div>
        <nav class="nav" id="nav-top" aria-label="Views"></nav>
      </header>
      <header class="embed-bar">
        <nav class="nav embed-tabs" id="nav-embed" aria-label="Views"></nav>
        <div class="embed-side">
          <span class="badge outline embed-ro" title="You can look at every change here, but not approve, reject or undo it."><svg class="icon sm" viewBox="0 0 16 16" aria-hidden="true"><rect x="3.5" y="7" width="9" height="6.5" rx="1" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M5.5 7V5a2.5 2.5 0 0 1 5 0v2" fill="none" stroke="currentColor" stroke-width="1.4"/></svg><span class="lbl">View only</span></span>
          <span class="conn" id="conn-embed" data-state="connecting" role="status"><span class="pip"></span><span class="txt">Connecting…</span></span>
          <button class="embed-search" type="button" data-action="palette" aria-label="Search or jump to">
            <svg class="icon sm" viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="m10.5 10.5 3 3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
            <span class="keys" aria-hidden="true"><kbd data-mod>Ctrl</kbd><kbd>K</kbd></span>
          </button>
        </div>
      </header>
      <div id="banner"></div>
      <main class="view" id="view" tabindex="-1"></main>
      <footer class="embed-foot"><a href="https://grapim.com" target="_blank" rel="noopener">Powered by <b>Grapim</b></a></footer>
    </div>
  </div>
  <div class="toasts" id="toasts" aria-live="polite"></div>
  <dialog id="dialog" aria-labelledby="dlg-title"></dialog>
  <noscript><p style="padding:24px">The review desk needs JavaScript.</p></noscript>
</body>
</html>
