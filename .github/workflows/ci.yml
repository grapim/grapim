name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # The full macOS and Windows run, once a week. In a private repo a macOS
  # minute counts as 10 and a Windows minute as 2 against the Actions quota,
  # so pushes and pull requests test on Ubuntu only.
  schedule:
    - cron: '0 3 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '["ubuntu-latest","macos-latest","windows-latest"]' || '["ubuntu-latest"]') }}
    steps:
      # The tests make real git repos and commits.
      - name: Git identity for test commits
        run: |
          git config --global user.name "Grapim CI"
          git config --global user.email "ci@grapim.invalid"
          git config --global init.defaultBranch main

      - uses: actions/checkout@v5

      # 22.x: the floor in package.json engines (>=22.13).
      - uses: actions/setup-node@v5
        with:
          node-version: 22.x

      - name: Versions
        run: |
          node --version
          npm --version
          git --version

      # Nothing to install: grapim has no dependencies. test/package.test.js
      # also checks what `npm pack` would publish.
      - name: Test
        run: npm test
